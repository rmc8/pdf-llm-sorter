[ollama]
base_url = "http://localhost:11434"
ocr_model = "deepseek-ocr:latest"
chat_model = "qwen3.5:latest"

[prompt]
system_prompt = """あなたはPDFドキュメントの整理・分類を専門とするAIアシスタントです。
提供されたドキュメントのテキスト内容を詳細に解析し、ファイルの適切な配置先カテゴリと分かりやすいリネーム後ファイル名を決定してください。

### ルール:
1. file_name:
   - 書類の内容が一目でわかる具体的な名前にしてください。
   - 推奨フォーマット: [日付]_[発行元または組織名]_[書類の種類・件名].pdf
   - 日付が特定できる場合は先頭に YYYYMMDD を付与してください。
   - 必ず末尾に .pdf を含めてください。
2. category:
   - 設定されたカテゴリー一覧の中から最も適したものを正確に1つ選択してください。
3. document_date:
   - 書類に記載された発行日・作成日・契約日など（YYYY-MM-DD形式、不明なら空文字）。
4. issuer:
   - 書類の発行元企業名・団体名・送信者。
5. summary:
   - 書類の重要事項（金額、期日、対象者、内容）の1〜2行程度の簡潔な要約。
6. tags:
   - 検索に役立つキーワードタグ（3〜5個程度）。
7. 表記・誤字補正:
   - OCRの読み取り誤り（例: カタカナのハ/ノの誤認など）がある場合は、文脈や一般的な組織名・日本語の自然な表記に合わせて自動補正してください。

### カテゴリー
{{categories}}
"""

[file_system]
input_folder = "./input"
output_folder = "./output"

[file_system.categories]
"契約書" = "賃貸借契約書、売買契約書、サービス利用規約、雇用契約書、各種合意書、覚書など"
"領収書" = "購入明細書、領収書、レシート、納品書、支払証明書など"
"請求書" = "月次請求書、サービス利用料請求書、支払通知書など"
"税金" = "確定申告書、住民税通知書、固定資産税通知書、納税証明書など"
"行政" = "住民票、マイナンバー関連通知、公的証明書、自治体からの各種通知など"
"就労" = "職務経歴書、雇用関係書類、就業規則、求人票など"
"給与" = "給与明細書、賞与明細書、源泉徴収票など"
"年金" = "ねんきん定期便、年金加入記録、国民年金・厚生年金関連書類など"
"保険" = "生命保険証券、損害保険証券、火災保険証券、保険料控除証明書など"
"医療" = "健康診断結果票、人間ドック結果票、診療明細書、処方箋、診断書など"
"金融" = "銀行口座開設通知、残高証明書、クレジットカード利用明細、証券取引報告書など"
"説明書" = "家電製品、電子機器、家具、ガジェットの取扱説明書、マニュアル、保証書など"
"書籍" = "電子書籍PDF、技術書、学習テキスト、講義・セミナー資料など"
"その他" = "上記いずれのカテゴリーにも明確に該当しない一般的な文書"
