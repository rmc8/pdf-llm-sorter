[project]
name = "pdf-llm-sorter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "langchain-ollama>=1.1.0",
    "pillow>=12.3.0",
    "polars>=1.44.1",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "rich>=13.9.0",
]

[project.scripts]
pdf-llm-sorter = "pdf_llm_sorter.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pdf_llm_sorter"]
